version: '3.8'

networks:
  fastapi_network:

services:
  db:
    image: postgres:15
    container_name: fastapi_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastapi_network

  fastapi:
    build: .
    container_name: fastapi_app
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - fastapi_network

volumes:
  postgres_data:
