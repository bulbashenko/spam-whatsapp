<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Search</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav id="main-nav">
        <div class="nav-content">
            <h1>Business Search</h1>
            <div class="nav-links">
                <span id="user-info" class="hidden">
                    Welcome, <span id="username"></span>
                </span>
                <button id="login-btn" class="btn"><i class="fas fa-sign-in-alt"></i> Login</button>
                <button id="register-btn" class="btn"><i class="fas fa-user-plus"></i> Register</button>
                <button id="logout-btn" class="btn hidden"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <main>
        <div id="auth-forms" class="container">
            <form id="login-form" class="auth-form hidden">
                <h2>Login</h2>
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>

            <form id="register-form" class="auth-form hidden">
                <h2>Register</h2>
                <div class="form-group">
                    <label for="register-username">Username:</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email:</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password:</label>
                    <input type="password" id="register-password" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm-password">Confirm Password:</label>
                    <input type="password" id="register-confirm-password" required>
                </div>
                <button type="submit" class="btn"><i class="fas fa-user-plus"></i> Register</button>
            </form>
        </div>

        <div id="search-section" class="container hidden">
            <form id="search-form">
                <div class="form-group">
                    <label for="business-type">Business Type:</label>
                    <input type="text" id="business-type" required 
                           placeholder="e.g., restaurant, cafe, gym">
                </div>
                <div class="form-group">
                    <label for="location">Location:</label>
                    <div class="location-input-container">
                        <input type="text" id="location" required 
                               placeholder="e.g., New York, NY">
                    </div>
                </div>
                <div class="form-group">
                    <label for="radius">Radius (km):</label>
                    <input type="number" id="radius" min="1" max="50" value="5">
                </div>
                <button type="submit" class="btn"><i class="fas fa-search"></i> Search</button>
            </form>

            <div id="progress-container" class="hidden">
                <div id="progress-bar">
                    <div id="progress"></div>
                </div>
                <p id="progress-text">Processing search...</p>
            </div>

            <div id="results-container" class="hidden">
                <div class="table-controls">
                    <div class="search-filter">
                        <i class="fas fa-search"></i>
                        <input type="text" id="table-search" placeholder="Filter results...">
                    </div>
                    <div class="export-controls">
                        <button id="export-csv" class="btn" title="Export as CSV">
                            <i class="fas fa-file-csv"></i> CSV
                        </button>
                        <button id="export-xlsx" class="btn" title="Export as Excel">
                            <i class="fas fa-file-excel"></i> Excel
                        </button>
                    </div>
                </div>
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Address</th>
                            <th>Rating</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="results-body"></tbody>
                </table>
                <div class="pagination">
                    <button id="prev-page" class="btn">Previous</button>
                    <span id="page-info">Page 1 of 1</span>
                    <button id="next-page" class="btn">Next</button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>


    <script type="module" src="/static/js/api.js"></script>
    <script type="module" src="/static/js/auth.js"></script>
    <script type="module" src="/static/js/search.js"></script>
    <script type="module" src="/static/js/ui.js"></script>
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
